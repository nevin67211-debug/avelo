version: '3.8'

services:
  backend:
    build: .
    container_name: avelo-backend
    ports:
      - "8000:8000"
    volumes:
      - ./main.py:/app/main.py
      - ./db:/app/db
      - ./avelo.db:/app/avelo.db
    environment:
      - DATABASE_URL=sqlite:///./avelo.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.next
    container_name: avelo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8000
    command: npm run dev
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib

networks:
  default:
    name: avelo-network
